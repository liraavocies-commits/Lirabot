services:
  - type: worker
    name: lira-anime-bot-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/lira.sqlite3
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: lira-anime-data
      mountPath: /var/data
      sizeGB: 1
